# On pushing a version tag (v1.2.3), builds the wheel + sdist and publishes a
# GitHub release with them attached — this is the "Option D" install source
# documented in docs/Installation.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VER — bump 'version' in pyproject.toml first"
            exit 1
          fi
          # Use the actual packaging library rather than a hand-rolled regex --
          # PEP 440 accepts many pre-release spellings (b1, -beta1, B1, rc1,
          # .dev1, ...) and a regex was confirmed to miss some of them.
          #
          # VER is passed as a CLI argument (sys.argv), never interpolated
          # into the -c source string: this job holds a write-capable
          # GITHUB_TOKEN, and a version string crafted to contain Python
          # syntax would otherwise execute as code -- confirmed as a real
          # injection risk via Greptile review of the previous version of
          # this fix, which did interpolate it directly into the source.
          IS_PRERELEASE=$(uv run --with packaging python3 -c "
          import sys
          from packaging.version import Version
          print('--prerelease' if Version(sys.argv[1]).is_prerelease else '')
          " "$VER")
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: Build wheel + sdist
        run: uv build

      - name: Publish GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes $IS_PRERELEASE
