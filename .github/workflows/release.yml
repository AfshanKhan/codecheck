# On pushing a version tag (v1.2.3), builds the wheel + sdist and publishes a
# GitHub release with them attached — this is the "Option D" install source
# documented in docs/Installation.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VER — bump 'version' in pyproject.toml first"
            exit 1
          fi
          # PEP 440 pre-release suffix (a1, b1, rc1, .dev1) -> publish as a
          # GitHub pre-release, not the repo's "Latest release".
          if [[ "$VER" =~ (a|b|rc)[0-9]+$ || "$VER" =~ \.dev[0-9]+$ ]]; then
            echo "IS_PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=" >> "$GITHUB_ENV"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build wheel + sdist
        run: uv build

      - name: Publish GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes $IS_PRERELEASE
