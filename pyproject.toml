[project]
name = "codecheck"
version = "0.2.0"
description = "Local, tiered code review tool for a diff or a whole repo: deterministic linters + optional cloud LLM pass."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.1",
    "rich>=13.7",
    "httpx>=0.27",
    "gitpython>=3.1.59",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pathspec>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Tier 1's ruff/semgrep sub-runners are "bring your own tool" by design --
# codecheck runs whatever version you already have configured for your
# project, rather than forcing a specific pinned version as a hard runtime
# dependency (which could conflict with a project's own pinned ruff/semgrep).
# This extra is just a convenience for getting a reasonable default install
# of both in one command if you don't already have them.
#
# eslint can't be included here at all -- it's an npm package, not a Python
# one, so there's no way to declare it as a Python dependency. Install it
# separately (e.g. `npm install -g eslint`) if you want that sub-runner.
rules = [
    "ruff>=0.16.4",
    "semgrep>=1.174.0",
]

# Only needed for --frappe-db-config -- a niche, opt-in feature most installs
# will never touch, so it stays out of the core dependency list. Lazily
# imported in frappe_db.py with a clear "pip install codecheck[frappe-db]"
# error if it's missing and that feature is actually requested.
frappe-db = [
    "pymysql>=1.1",
]

[project.scripts]
codecheck = "codecheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codecheck"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned so CI lint is deterministic: ruff's default rule set widened in 0.16
# and now flags intentional patterns (e.g. B008 on typer.Option() defaults).
# Classic stable default (pycodestyle errors + pyflakes) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]
